[project]
name = "nexus-content-os"
version = "0.1.0"
description = "NEXUS Content OS — Plataforma de producción de contenido multiformato asistida por IA"
requires-python = ">=3.11"

dependencies = [
    # Core
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",

    # Orquestación agéntica
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "langsmith>=0.1.0",

    # Base vectorial
    "qdrant-client>=1.9.0",

    # Base de datos
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # Cache / eventos
    "redis[asyncio]>=5.0.0",

    # APIs LLM directas
    "anthropic>=0.28.0",
    "openai>=1.30.0",

    # Utilidades
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

audio-video = [
    "openai-whisper>=20231117",
    "ffmpeg-python>=0.2.0",
    "moviepy>=1.0.3",
    "pyscenedetect>=0.6.3",
    "librosa>=0.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
